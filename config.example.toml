# Glorious Auto Polling Rate configuration
#
# This file lives next to the executable and is created automatically on first
# run. Edit it, then choose "Reload config" from the tray menu to apply changes.

# Switching strategy.
#   "focus"   follow the focused window. The foreground app decides the rate.
#   "running" follow running processes. If any listed program is running, its
#             rate is used (the highest wins when several match).
mode = "focus"

# Rate in Hz used when nothing matches. This is your battery saving rate.
inactive_rate = 500

# Rate in Hz for listed programs that do not set their own rate.
active_rate = 1000

# How often "running" mode rescans processes, in milliseconds. Ignored in
# "focus" mode, which is fully event driven and uses no CPU while idle.
poll_interval_ms = 2000

# Show a small tray notification whenever the rate changes.
notifications = true

# The programs to watch. Add one block per program.
# "exe" is the executable name and is matched case insensitively.
# "rate" is optional. When omitted, active_rate is used.
#
# [[programs]]
# exe = "cs2.exe"
# rate = 4000
#
# [[programs]]
# exe = "valorant.exe"
# rate = 2000
#
# [[programs]]
# exe = "chrome.exe"   # no rate, so active_rate (1000) is used

[[programs]]
exe = "cs2.exe"
rate = 4000

[[programs]]
exe = "valorant.exe"
rate = 2000

# Device protocol.
#
# The command bytes below are the exact reports the mouse expects for each
# polling rate. They were captured from Glorious CORE on a Model D2 Pro 4K and
# should work as is for that device. If you have different hardware, see
# docs/CAPTURE.md for the one time capture steps.
[protocol]
vid = 0x258A          # Glorious
pid = 0x2036          # Model D2 Pro 4K dongle
usage_page = 0xFFFF   # vendor collection to open, 0 to disable the filter
usage = 0             # vendor usage to match, 0 to disable the filter
method = "feature"    # "feature" (HidD_SetFeature) or "output" (WriteFile)
report_length = 0     # 0 uses the device report length, or force a length

# Full report bytes per rate, including the leading report id.
#
# Layout of the report, as observed on the wire:
#
#   00        report id
#   00 00     header
#   02        write command
#   03        payload length that follows the setting id
#   01        bank
#   0A        setting id, 0x0A is the polling rate
#   01        count
#   XX XX     the rate code, sent twice
#
# Trailing zeros up to the 65 byte feature report are added automatically, so
# only the meaningful head of the report is listed here.
#
# Rate codes: 125 = 0x08, 250 = 0x04, 500 = 0x02, 1000 = 0x01,
#             2000 = 0x20, 4000 = 0x40.
#
# An empty array means the command is not known, and that rate is unavailable.
# The 4K dongle tops out at 4000, so 8000 is left empty.
[protocol.commands]
"125"  = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x08, 0x08]
"250"  = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x04, 0x04]
"500"  = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x02, 0x02]
"1000" = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x01, 0x01]
"2000" = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x20, 0x20]
"4000" = [0x00, 0x00, 0x00, 0x02, 0x03, 0x01, 0x0A, 0x01, 0x40, 0x40]
"8000" = []
