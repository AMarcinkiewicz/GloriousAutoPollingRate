[package]
name = "glorious-auto-polling-rate"
version = "0.3.2"
edition = "2021"
description = "A tiny Windows tray tool that automatically switches your Glorious mouse polling rate per application."
license = "MIT"
repository = "https://github.com/amarcinkiewicz/GloriousAutoPollingRate"
readme = "README.md"

[[bin]]
name = "GloriousAutoPollingRate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
]

# Optimize the release build for a tiny, self contained binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
